<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deck SNES Web Host</title>
  <script src="./public/coi-serviceworker.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; height: 100vh;
      background: #050505; color: #fff;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      font-family: system-ui, sans-serif; overflow: hidden;
    }
    #canvas {
      width: 100vw; height: 100vh;
      object-fit: contain; image-rendering: pixelated;
    }
    #ui-container {
      position: absolute; text-align: center; background: rgba(0,0,0,0.85);
      padding: 24px; border-radius: 12px; border: 1px solid #333; z-index: 10;
    }
    input[type="file"] { display: none; }
    .btn {
      background: #107c41; color: white; padding: 12px 24px;
      border: none; border-radius: 6px; font-weight: bold;
      cursor: pointer; font-size: 16px; margin-top: 12px;
    }
    .btn:hover { background: #1f9a55; }
  </style>
</head>
<body>
  <div id="ui-container">
    <h2 id="status-title">SNES Web Host</h2>
    <p id="status-msg" style="margin-top: 8px; color: #aaa;">Select a ROM from your Steam Deck to save it locally.</p>
    <button class="btn" id="load-btn" onclick="document.getElementById('rom-input').click()">Load ROM File</button>
    <input type="file" id="rom-input" accept=".smc,.sfc" />
  </div>
  <canvas id="canvas" tabindex="-1"></canvas>

  <script type="module" src="./main.js"></script>
</body>
</html>
